name: Export Lyquor images

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Install skopeo
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo

      - name: Export tools image
        run: |
          skopeo copy --override-arch amd64 \
            docker://ghcr.io/lyquor-labs/lyquor-tools:v0.8.4 \
            docker-archive:lyquor-tools-v0.8.4.tar:ghcr.io/lyquor-labs/lyquor-tools:v0.8.4
          gzip -1 lyquor-tools-v0.8.4.tar
          ls -lh lyquor-tools-v0.8.4.tar.gz

      - name: Export bartender image
        run: |
          skopeo copy --override-arch amd64 \
            docker://ghcr.io/lyquor-labs/lyquids:bartender-bartender_release-latest \
            docker-archive:bartender-v0.8.4.tar:ghcr.io/lyquor-labs/lyquids:bartender-bartender_release-latest
          gzip -1 bartender-v0.8.4.tar
          ls -lh bartender-v0.8.4.tar.gz

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "images-v0.8.4" \
            lyquor-tools-v0.8.4.tar.gz \
            bartender-v0.8.4.tar.gz \
            --title "Lyquor images v0.8.4" \
            --notes "Docker image exports for offline loading"
