name: Export Lyquor tools image

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Install skopeo
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo

      - name: Export tools image
        run: |
          skopeo copy --override-arch amd64 \
            docker://ghcr.io/lyquor-labs/lyquor-tools:v0.8.4 \
            docker-archive:lyquor-tools-v0.8.4.tar:ghcr.io/lyquor-labs/lyquor-tools:v0.8.4
          gzip -1 lyquor-tools-v0.8.4.tar
          ls -lh lyquor-tools-v0.8.4.tar.gz

      - name: Publish release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "tools-v0.8.4" \
            lyquor-tools-v0.8.4.tar.gz \
            --title "Lyquor tools image v0.8.4" \
            --notes "Docker image export for offline loading. Bartender is pulled by shaker at runtime."
