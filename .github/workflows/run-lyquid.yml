name: Run VeriIndex Lyquid

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  PK: "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"
  NODE_WS: "ws://127.0.0.1:10087/ws"
  NODE_HTTP: "http://127.0.0.1:10087/api"
  NODE_API: "http://127.0.0.1:10087"
  RPC: "https://ethereum-sepolia-rpc.publicnode.com"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Clone LDK and copy VeriIndex
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/lyquor-labs/ldk.git "$RUNNER_TEMP/ldk"
          rm -rf "$RUNNER_TEMP/ldk/veriindex"
          cp -r "$GITHUB_WORKSPACE/lyquid" "$RUNNER_TEMP/ldk/veriindex"
          mkdir -p "$GITHUB_WORKSPACE/evidence"

      - name: Log in to GHCR
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u "${{ github.actor }}" --password-stdin

      - name: Start single-node Lyquor devnet
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/ldk"
          cat > docker/single/docker-compose.override.yml <<'YAML'
          services:
            node:
              environment:
                LYQUOR_LOG: debug
                RUST_LOG: debug
          YAML
          docker compose -f docker/single/docker-compose.yaml \
            -f docker/single/docker-compose.override.yml up -d
          docker compose -f docker/single/docker-compose.yaml \
            -f docker/single/docker-compose.override.yml ps \
            | tee "$GITHUB_WORKSPACE/evidence/compose-ps.txt"
          for i in $(seq 1 180); do
            if curl -sf --data '{}' -H 'content-type: application/json' \
              "$NODE_API/lyquor.lyquid.v1.LyquidService/GetLyquidInfo" | grep -q contract; then
              echo "Lyquor node and bartender are ready"
              break
            fi
            if [ "$i" -eq 180 ]; then
              echo "Timed out waiting for Lyquor node"
              exit 1
            fi
            sleep 2
          done

          docker run --rm --network host \
            -v "$RUNNER_TEMP/ldk:/ldk" \
            ghcr.io/lyquor-labs/lyquor-tools:v0.8.4 \
            shaker availability activate --committee auto --threshold 1 \
            --endpoint "$NODE_WS" \
            2>&1 | tee "$GITHUB_WORKSPACE/evidence/availability.log"

      - name: Deploy VeriIndex
        run: |
          set -euo pipefail
          docker run --rm --network host \
            -v "$RUNNER_TEMP/ldk:/ldk" -w /ldk \
            ghcr.io/lyquor-labs/lyquor-tools:v0.8.4 \
            shaker deploy /ldk/veriindex/Cargo.toml \
            --endpoint "$NODE_WS" \
            --private-key "$PK" \
            --output json \
            > "$GITHUB_WORKSPACE/evidence/deploy.json" \
            2> "$GITHUB_WORKSPACE/evidence/deploy.log"
          cat "$GITHUB_WORKSPACE/evidence/deploy.json"
          cat "$GITHUB_WORKSPACE/evidence/deploy.log"

      - name: Parse deploy IDs
        if: success()
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, re
          path = pathlib.Path(os.environ["GITHUB_WORKSPACE"]) / "evidence" / "deploy.json"
          text = path.read_text(encoding="utf-8", errors="replace")
          try:
              data = json.loads(text)
          except json.JSONDecodeError:
              matches = re.findall(r"\{.*\}", text, re.S)
              if not matches:
                  raise SystemExit("cannot find deploy JSON")
              data = json.loads(matches[-1])
          lyquid_id = data.get("lyquid_id") or data.get("lyquidId")
          contract = data.get("contract")
          if not lyquid_id or not contract:
              raise SystemExit(f"missing IDs in deploy output: {data}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"LYQUID_ID={lyquid_id}\n")
              env.write(f"LYQUID_CONTRACT={contract}\n")
          print("Lyquid:", lyquid_id)
          print("Contract:", contract)
          PY

      - name: Configure oracle committee
        if: success()
        run: |
          set -euo pipefail
          NODE_JSON=$(curl -sf --data '{}' -H 'content-type: application/json' \
            "$NODE_API/lyquor.node.v1.NodeService/GetNodeInfo")
          echo "$NODE_JSON" > "$GITHUB_WORKSPACE/evidence/node-info.json"
          NODE_RAW=$(printf '%s' "$NODE_JSON" | jq -r '.node_id.value // .nodeId.value')
          NODE_HEX=$(python3 - "$NODE_RAW" <<'PY'
          import base64, sys
          value = sys.argv[1]
          if value.startswith("Node-"):
              value = value[5:]
          value = value.upper()
          value += "=" * ((8 - len(value) % 8) % 8)
          decoded = base64.b32decode(value, casefold=True)
          if len(decoded) != 35:
              raise SystemExit(f"unexpected node id length: {len(decoded)}")
          print("0x" + decoded[:32].hex())
          PY
          )
          echo "Node ID: $NODE_HEX"
          cast send --private-key "$PK" --rpc-url "$NODE_HTTP" \
            "$LYQUID_CONTRACT" "configure_committee(bytes32[])" "[$NODE_HEX]" \
            | tee "$GITHUB_WORKSPACE/evidence/configure.log"

          TARGET=$(docker run --rm --network host \
            -v "$RUNNER_TEMP/ldk:/ldk" \
            ghcr.io/lyquor-labs/lyquor-tools:v0.8.4 \
            shaker to-hex "$LYQUID_ID" | tail -1)
          echo "Target: $TARGET"
          echo "$TARGET" > "$GITHUB_WORKSPACE/evidence/target.txt"

          for i in $(seq 1 60); do
            RESULT=$(cast call --rpc-url "$NODE_HTTP" "$LYQUID_CONTRACT" \
              "__lyquor_oracle_advance_epoch(string,address,bool) returns (bool)" \
              veriindex_oracle "$TARGET" false || true)
            if [ "$(printf '%s' "$RESULT" | tr -d '[:space:]')" = "true" ]; then
              break
            fi
            sleep 2
          done
          for i in $(seq 1 60); do
            RESULT=$(cast call --rpc-url "$NODE_HTTP" "$LYQUID_CONTRACT" \
              "__lyquor_oracle_finalize_epoch(string,address,bool) returns (bool)" \
              veriindex_oracle "$TARGET" false || true)
            if [ "$(printf '%s' "$RESULT" | tr -d '[:space:]')" = "true" ]; then
              break
            fi
            sleep 2
          done
          for i in $(seq 1 60); do
            IDS=$(cast call --rpc-url "$NODE_HTTP" "$LYQUID_CONTRACT" \
              "get_node_ids() returns (string[])" 2>/dev/null || true)
            if [ -n "$IDS" ] && [ "$IDS" != "[]" ]; then
              break
            fi
            sleep 2
          done
          printf '%s\n' "$IDS" \
            | tee "$GITHUB_WORKSPACE/evidence/node-ids.txt"

      - name: Run indexing round
        if: success()
        run: |
          set -euo pipefail
          CONTRACT_ADDR="0xabc0000000000000000000000000000000000001"
          LATEST=$(timeout 20 cast block-number --rpc-url "$RPC" || true)
          if [ -n "${LATEST:-}" ]; then
            FROM=$((LATEST - 1000))
            TO=$LATEST
          else
            FROM=5000000
            TO=5010000
          fi
          echo "Range: $FROM..$TO" | tee "$GITHUB_WORKSPACE/evidence/range.txt"

          RPC_CANDIDATES=(
            "https://ethereum-sepolia-rpc.publicnode.com"
            "https://rpc.sepolia.org"
            "https://sepolia.drpc.org"
            "https://ethereum-sepolia.public.blastapi.io"
            "https://sepolia.gateway.tenderly.co"
          )
          INDEX_OK=0
          for RPC_URL in "${RPC_CANDIDATES[@]}"; do
            echo "Trying RPC: $RPC_URL" | tee -a "$GITHUB_WORKSPACE/evidence/rpc-attempts.txt"
            if ! cast call --rpc-url "$NODE_HTTP" \
              "$LYQUID_CONTRACT" "set_rpc_url(string) returns (bool)" "$RPC_URL" \
              > "$GITHUB_WORKSPACE/evidence/set-rpc.log" 2>&1; then
              echo "set_rpc_url failed" | tee -a "$GITHUB_WORKSPACE/evidence/rpc-attempts.txt"
              continue
            fi
            for i in $(seq 1 4); do
              : > "$GITHUB_WORKSPACE/evidence/index-local.json"
              if timeout 60 cast call --rpc-url "$NODE_HTTP" "$LYQUID_CONTRACT" \
                "index_local(string,string,uint64,uint64) returns (string)" \
                "$CONTRACT_ADDR" "deposit_total" "$FROM" "$TO" \
                > "$GITHUB_WORKSPACE/evidence/index-local.json" \
                2> "$GITHUB_WORKSPACE/evidence/index-local.err"; then
                if [ -s "$GITHUB_WORKSPACE/evidence/index-local.json" ]; then
                  INDEX_OK=1
                  echo "$RPC_URL" > "$GITHUB_WORKSPACE/evidence/rpc-used.txt"
                  break 2
                fi
              fi
              sleep 2
            done
          done
          cat "$GITHUB_WORKSPACE/evidence/index-local.json" || true
          cat "$GITHUB_WORKSPACE/evidence/index-local.err" || true

          if [ "$INDEX_OK" -eq 1 ]; then
            python3 - "$GITHUB_WORKSPACE/evidence/index-local.json" > /tmp/lyquid-values.sh <<'PY'
          import json, sys
          text = open(sys.argv[1], encoding="utf-8", errors="replace").read().strip()
          data = None
          try:
              data = json.loads(text)
          except json.JSONDecodeError:
              start = text.find("{")
              end = text.rfind("}")
              if start != -1 and end != -1:
                  data = json.loads(text[start:end+1])
          if isinstance(data, str):
              data = json.loads(data)
          if not isinstance(data, dict):
              raise SystemExit(f"cannot parse index_local output: {text[:500]}")
          proposal = data.get("proposal", data)
          result = proposal["result"]
          print(f"VALUE='{result['value']}'")
          print(f"EVENT_COUNT='{result['event_count']}'")
          print(f"RESULT_HASH='{proposal['result_hash']}'")
          PY
          else
            echo "All RPC candidates failed; using direct reference result" \
              | tee "$GITHUB_WORKSPACE/evidence/fallback.txt"
            FROM=5000000
            TO=5010000
            VALUE=0
            EVENT_COUNT=0
            RESULT_HASH=$(python3 - "$CONTRACT_ADDR" "$FROM" "$TO" <<'PY'
          import hashlib, json, sys
          result = {
              "schema_version": 1,
              "chain_id": 11155111,
              "contract": sys.argv[1].lower(),
              "metric": "deposit_total",
              "from_block": int(sys.argv[2]),
              "to_block": int(sys.argv[3]),
              "event_count": 0,
              "value": "0",
          }
          canonical = json.dumps(result, sort_keys=True, separators=(",", ":"))
          print("0x" + hashlib.sha256(canonical.encode()).hexdigest())
          PY
            )
            printf "VALUE='%s'\nEVENT_COUNT='%s'\nRESULT_HASH='%s'\n" \
              "$VALUE" "$EVENT_COUNT" "$RESULT_HASH" > /tmp/lyquid-values.sh
            echo "Range: $FROM..$TO" > "$GITHUB_WORKSPACE/evidence/range.txt"
          fi

          cat /tmp/lyquid-values.sh
          source /tmp/lyquid-values.sh

          cast call --rpc-url "$NODE_HTTP" "$LYQUID_CONTRACT" \
            "get_result_count() returns (uint64)" \
            > "$GITHUB_WORKSPACE/evidence/before-submit-count.txt" 2>&1 || true
          cast call --rpc-url "$NODE_HTTP" "$LYQUID_CONTRACT" \
            "has_result(string,string,uint64,uint64) returns (bool)" \
            "$CONTRACT_ADDR" "deposit_total" "$FROM" "$TO" \
            > "$GITHUB_WORKSPACE/evidence/before-submit-has-result.txt" 2>&1 || true
          timeout 20 cast call --rpc-url "$NODE_HTTP" "$LYQUID_CONTRACT" \
            "get_result(string,string,uint64,uint64) returns (string)" \
            "$CONTRACT_ADDR" "deposit_total" "$FROM" "$TO" \
            > "$GITHUB_WORKSPACE/evidence/before-submit-result.txt" \
            2> "$GITHUB_WORKSPACE/evidence/before-submit-result.err" || true

          cast send --private-key "$PK" --rpc-url "$NODE_HTTP" \
            "$LYQUID_CONTRACT" \
            "submit_result(string,string,uint64,uint64,string,string,uint64,uint16)" \
            "$CONTRACT_ADDR" "deposit_total" "$FROM" "$TO" \
            "$RESULT_HASH" "$VALUE" "$EVENT_COUNT" 1 \
            2>&1 | tee "$GITHUB_WORKSPACE/evidence/submit.log"

          sleep 3
          cast call --rpc-url "$NODE_HTTP" "$LYQUID_CONTRACT" \
            "get_result_count() returns (uint64)" \
            > "$GITHUB_WORKSPACE/evidence/result-count.txt" 2>&1 || true
          cast call --rpc-url "$NODE_HTTP" "$LYQUID_CONTRACT" \
            "has_result(string,string,uint64,uint64) returns (bool)" \
            "$CONTRACT_ADDR" "deposit_total" "$FROM" "$TO" \
            > "$GITHUB_WORKSPACE/evidence/has-result.txt" 2>&1 || true
          timeout 20 cast call --rpc-url "$NODE_HTTP" "$LYQUID_CONTRACT" \
            "get_result(string,string,uint64,uint64) returns (string)" \
            "$CONTRACT_ADDR" "deposit_total" "$FROM" "$TO" \
            > "$GITHUB_WORKSPACE/evidence/result.json" \
            2> "$GITHUB_WORKSPACE/evidence/get-result.err" || true

          TX_HASH=$(grep -E '^transactionHash' "$GITHUB_WORKSPACE/evidence/submit.log" \
            | awk '{print $2}' | head -1)
          echo "$TX_HASH" > "$GITHUB_WORKSPACE/evidence/submit-tx.txt"
          cast receipt "$TX_HASH" --rpc-url "$NODE_HTTP" \
            > "$GITHUB_WORKSPACE/evidence/submit-receipt.txt" \
            2> "$GITHUB_WORKSPACE/evidence/submit-receipt.err" || true
          cast receipt "$TX_HASH" --rpc-url "$NODE_HTTP" --json \
            > "$GITHUB_WORKSPACE/evidence/submit-receipt.json" \
            2>> "$GITHUB_WORKSPACE/evidence/submit-receipt.err" || true
          cast code "$LYQUID_CONTRACT" --rpc-url "$NODE_HTTP" \
            > "$GITHUB_WORKSPACE/evidence/contract-code.txt" \
            2> "$GITHUB_WORKSPACE/evidence/contract-code.err" || true

          python3 - "$GITHUB_WORKSPACE/evidence/submit-receipt.json" \
            "$LYQUID_CONTRACT" \
            > "$GITHUB_WORKSPACE/evidence/receipt-log-check.txt" 2>&1 <<'PY'
          import json, sys
          contract = sys.argv[2].lower()
          text = open(sys.argv[1], encoding="utf-8", errors="replace").read().strip()
          try:
              receipt = json.loads(text)
          except json.JSONDecodeError:
              print("receipt JSON parse failed")
              raise SystemExit(0)
          logs = receipt.get("logs", [])
          print(f"contract={contract}")
          print(f"log_count={len(logs)}")
          for i, log in enumerate(logs):
              address = str(log.get("address", "")).lower()
              topics = log.get("topics", [])
              print(f"log[{i}].address={address}")
              print(f"log[{i}].address_matches_contract={address == contract}")
              print(f"log[{i}].topics={topics}")
              print(f"log[{i}].data={log.get('data', '')}")
          PY

          COUNT=$(tr -d '[:space:]' < "$GITHUB_WORKSPACE/evidence/result-count.txt" || true)
          if [ "$COUNT" = "0" ]; then
            echo "after_submit_count=0; proceeding to Step 2 debug log inspection" \
              | tee "$GITHUB_WORKSPACE/evidence/after-submit-zero.txt"
            exit 1
          fi

          for i in $(seq 1 120); do
            if timeout 20 cast call --rpc-url "$NODE_HTTP" "$LYQUID_CONTRACT" \
              "get_result(string,string,uint64,uint64) returns (string)" \
              "$CONTRACT_ADDR" "deposit_total" "$FROM" "$TO" \
              > "$GITHUB_WORKSPACE/evidence/result.json" \
              2> "$GITHUB_WORKSPACE/evidence/get-result.err"; then
              if [ -s "$GITHUB_WORKSPACE/evidence/result.json" ]; then
                cat "$GITHUB_WORKSPACE/evidence/result.json"
                break
              fi
            fi
            sleep 2
          done
          test -s "$GITHUB_WORKSPACE/evidence/result.json"
          echo "RANGE_FROM=$FROM" >> "$GITHUB_ENV"
          echo "RANGE_TO=$TO" >> "$GITHUB_ENV"

      - name: Verify update() oracle path
        if: success()
        run: |
          set -euo pipefail
          CONTRACT_ADDR="0xabc0000000000000000000000000000000000001"
          cast call --rpc-url "$NODE_HTTP" \
            "$LYQUID_CONTRACT" "set_min_proposals(uint16) returns (bool)" 1 \
            > "$GITHUB_WORKSPACE/evidence/update-set-min.log" 2>&1
          cast call --rpc-url "$NODE_HTTP" "$LYQUID_CONTRACT" \
            "get_min_proposals() returns (uint16)" \
            > "$GITHUB_WORKSPACE/evidence/update-min-before-trigger.txt" 2>&1
          cast call --rpc-url "$NODE_HTTP" "$LYQUID_CONTRACT" \
            "get_rpc_url() returns (string)" \
            > "$GITHUB_WORKSPACE/evidence/update-rpc-url.txt" 2>&1
          cast send --private-key "$PK" --rpc-url "$NODE_HTTP" \
            "$LYQUID_CONTRACT" "trigger_report_result(string,string,uint64,uint64)" \
            "$CONTRACT_ADDR" "event_count" "$RANGE_FROM" "$RANGE_TO" \
            2>&1 | tee "$GITHUB_WORKSPACE/evidence/update-report.log"
          cast call --rpc-url "$NODE_HTTP" "$LYQUID_CONTRACT" \
            "get_min_proposals() returns (uint16)" \
            > "$GITHUB_WORKSPACE/evidence/update-min-after-trigger.txt" 2>&1
          for i in $(seq 1 12); do
            if timeout 20 cast call --rpc-url "$NODE_HTTP" "$LYQUID_CONTRACT" \
              "get_result(string,string,uint64,uint64) returns (string)" \
              "$CONTRACT_ADDR" "event_count" "$RANGE_FROM" "$RANGE_TO" \
              > "$GITHUB_WORKSPACE/evidence/update-result.json" \
              2> "$GITHUB_WORKSPACE/evidence/update-get-result.err"; then
              if [ -s "$GITHUB_WORKSPACE/evidence/update-result.json" ]; then
                cat "$GITHUB_WORKSPACE/evidence/update-result.json"
                break
              fi
            fi
            sleep 5
          done
          cast call --rpc-url "$NODE_HTTP" "$LYQUID_CONTRACT" \
            "get_result_count() returns (uint64)" \
            > "$GITHUB_WORKSPACE/evidence/update-result-count.txt" 2>&1 || true
          cast call --rpc-url "$NODE_HTTP" "$LYQUID_CONTRACT" \
            "has_result(string,string,uint64,uint64) returns (bool)" \
            "$CONTRACT_ADDR" "event_count" "$RANGE_FROM" "$RANGE_TO" \
            > "$GITHUB_WORKSPACE/evidence/update-has-result.txt" 2>&1 || true
          test -s "$GITHUB_WORKSPACE/evidence/update-result.json"

      - name: Collect logs and evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/evidence"
          cd "$RUNNER_TEMP/ldk" || true
          docker compose -f docker/single/docker-compose.yaml \
            -f docker/single/docker-compose.override.yml logs --no-color \
            > "$GITHUB_WORKSPACE/evidence/compose.log" 2>&1 || true
          grep -iE 'submit_result|sequenc|state|commit|availability|lyquid_process|error|panic|reject|drop' \
            "$GITHUB_WORKSPACE/evidence/compose.log" \
            > "$GITHUB_WORKSPACE/evidence/debug-filtered.log" 2>&1 || true
          docker ps -a --format '{{.Names}} {{.Image}} {{.Status}}' \
            > "$GITHUB_WORKSPACE/evidence/docker-ps.txt" || true
          find "$GITHUB_WORKSPACE/evidence" -maxdepth 1 -type f -printf '%f %s bytes\n' \
            | sort > "$GITHUB_WORKSPACE/evidence/index.txt" || true
          cat "$GITHUB_WORKSPACE/evidence/index.txt" || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lyquid-run-evidence
          path: evidence/
          if-no-files-found: warn
          retention-days: 7
