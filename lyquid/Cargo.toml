[package]
name = "veriindex"
publish = false
version = "0.1.0"
edition = "2024"
authors = ["Bettybear5"]
description = "VeriIndex: verifiable historical event indexer on Lyquor"

[dependencies]
lyquid = { version = "0.8.4", features = ["ldk"], git = "https://github.com/lyquor-labs/ldk.git" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
thiserror = "1"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
strip = "debuginfo"
debug = false

[workspace]
