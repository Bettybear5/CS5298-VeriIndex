[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "veriindex-reference"
version = "0.1.0"
description = "Runnable reference implementation for VeriIndex"
requires-python = ">=3.11"
dependencies = [
  "eth-account>=0.13",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
veriindex = "veriindex.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["veriindex*"]
